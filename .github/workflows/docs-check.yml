name: Docs check

# Docs-as-code: every change is linted and every link is checked,
# the same way code is tested before it is merged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.2 "**/*.md"

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Sign-in pages and bot-protected sites block automated checkers,
          # so they are skipped or their "forbidden" answer is accepted.
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429,503
            --exclude localhost
            --exclude 127.0.0.1
            --exclude aistudio.google.com
            --exclude console.groq.com
            "**/*.md"
          fail: true
        env:
          # Lets the checker visit github.com links without hitting rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
